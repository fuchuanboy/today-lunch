name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up JDK
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v5
        with:
          gradle-version: '8.10'

      - name: Normalize Kotlin source
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('app/src/main/java/com/fuchuanboy/todaylunch/MainActivity.kt')
          s = p.read_text(encoding='utf-8')
          for a, b in {
              '$vegetable焖至断生': '${vegetable}焖至断生',
              '$vegetable快速翻炒': '${vegetable}快速翻炒',
              '$green洗净沥干': '${green}洗净沥干',
              '$green快速翻炒': '${green}快速翻炒',
              'private lateinit var score: TextView': 'private lateinit var scoreView: TextView',
              'score = TextView': 'scoreView = TextView',
              'root.addView(score)': 'root.addView(scoreView)',
              'score.text =': 'scoreView.text ='
          }.items():
              s = s.replace(a, b)
          lines = []
          for line in s.splitlines():
              if 'scoreView.text =' in line:
                  prefix, expr = line.split('scoreView.text =', 1)
                  line = prefix + 'scoreView.setText(' + expr.strip() + ')'
              lines.append(line)
          p.write_text('\n'.join(lines) + '\n', encoding='utf-8')
          PY

      - name: Show Kotlin lines around compiler error
        run: nl -ba app/src/main/java/com/fuchuanboy/todaylunch/MainActivity.kt | sed -n '124,134p'

      - name: Build debug APK
        run: gradle :app:assembleDebug --no-daemon

      - name: Verify APK exists
        run: ls -lh app/build/outputs/apk/debug/app-debug.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: today-lunch-ultimate-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30
