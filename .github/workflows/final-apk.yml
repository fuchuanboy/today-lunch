name: Final Lunch APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10'
      - name: Install final activity
        run: |
          sed 's/class FinalActivity/class MainActivity/' app/src/main/java/com/fuchuanboy/todaylunch/FinalActivity.kt > app/src/main/java/com/fuchuanboy/todaylunch/MainActivity.kt
          MANIFEST=$(find app/src/main -name AndroidManifest.xml | head -1)
          if ! grep -q 'android.permission.INTERNET' "$MANIFEST"; then
            sed -i '/<manifest/a\    <uses-permission android:name="android.permission.INTERNET" />' "$MANIFEST"
          fi
      - name: Build final debug APK
        run: gradle :app:assembleDebug --no-daemon
      - name: Verify APK
        run: test -s app/build/outputs/apk/debug/app-debug.apk
      - name: Upload final APK
        uses: actions/upload-artifact@v4
        with:
          name: today-lunch-final-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30
